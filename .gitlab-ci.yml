stages:
  - test

run_automation:
  stage: test
  # Меняем образ на специальный (со встроенным Chrome Headless и драйверами), чтобы Selenide работал из коробки
  image: alekzdone/maven-3.9-jdk-21-chrome:latest

  services:
    - name: mysql:8.0
      alias: mysql
    - name: apache/kafka:3.7.0
      alias: kafka
    # Бэкенд и фронтенд запускаем следом за инфраструктурой
    - name: reqin0/shopeasy-backend:latest
      alias: backend
    - name: reqin0/shopeasy-frontend:latest
      alias: frontend

  variables:
    # Настройки для Selenide: запускаем браузер без графического интерфейса (headless) и отключаем песочницу для Docker
    SELENIDE_HEADLESS: "true"
    SELENIDE_CHROME_OPTIONS: "--no-sandbox --disable-dev-shm-usage"

    # Переменные для базы данных
    MYSQL_DATABASE: "shopeasy"
    MYSQL_ROOT_PASSWORD: "1234"

    # Переменные для бэкенда.
    # Добавляем параметры авто-реконнекта и ожидания, чтобы бэкенд не падал, пока MySQL поднимается
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shopeasy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&autoReconnect=true&connectTimeout=30000"
    SPRING_DATASOURCE_USERNAME: "root"
    SPRING_DATASOURCE_PASSWORD: "1234"
    SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    # Переменные для настройки встроенной Кафки
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_LISTENERS: "INSIDE://:9092,CONTROLLER://:9093"
    KAFKA_ADVERTISED_LISTENERS: "INSIDE://kafka:9092"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INSIDE"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
    KAFKA_OFFER_AUTO_CREATE_TOPICS: "true"

  script:
    # Главный рычаг: даем контейнерам (особенно Кафке и Бэкенду) 30 секунд, чтобы полностью инициализироваться до запуска тестов
    - sleep 30
    - mvn clean test

  artifacts:
    when: always
    paths:
      - target/allure-results
      - allure-results
    expire_in: 7 days