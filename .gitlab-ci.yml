stages:
  - test

run_automation:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21

  services:
  - name: mysql:8.0
    alias: mysql
  - name: apache/kafka:3.7.0
    alias: kafka
  - name: reqin0/shopeasy-backend:latest
    alias: backend
    # РЫЧАГ: Передаем переменные целенаправленно внутрь бэкенда
    variables:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shopeasy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&autoReconnect=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  - name: reqin0/shopeasy-frontend:latest
    alias: frontend
    # Передаем фронтенду адрес бэкенда, чтобы запросы из UI шли в правильный контейнер
    variables:
      API_URL: "http://backend:8080"
  - name: selenium/standalone-chrome:latest
    alias: selenium

  variables:
    FF_NETWORK_PER_BUILD: "true"
    MYSQL_DATABASE: "shopeasy"
    MYSQL_ROOT_PASSWORD: "1234"
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shopeasy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&autoReconnect=true"
    SPRING_DATASOURCE_USERNAME: "root"
    SPRING_DATASOURCE_PASSWORD: "1234"
    SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    KAFKA_NODE_ID: "1"
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_LISTENERS: "INSIDE://:9092,CONTROLLER://:9093"
    KAFKA_ADVERTISED_LISTENERS: "INSIDE://kafka:9092"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INSIDE"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
    KAFKA_OFFER_AUTO_CREATE_TOPICS: "true"

  before_script:
  # Даем сервисам 30 секунд на запуск
  - sleep 30

  script:
  - mvn clean test -Dapi.url="http://backend:8080"

  artifacts:
    when: always
    paths:
      - target/allure-results
      - allure-results
    expire_in: 7 days